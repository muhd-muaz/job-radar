name: daily-run

on:
  schedule:
    - cron: "30 */4 * * *"   # every 4 hours, from 08:30 Malaysia time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["inbox/**", "config/**", "jobradar/**"]

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: pip install -q pytest && python -m pytest -q tests
      # The database lives on the `data` branch as a single commit, so main's history doesn't grow every day
      - name: Restore database
        run: |
          mkdir -p data
          git fetch -q origin data && git show origin/data:jobs.sqlite > data/jobs.sqlite || echo "no database yet"
      - name: Collect, score and build the shortlist
        run: python -m jobradar
        env:
          CAREERJET_AFFID: ${{ secrets.CAREERJET_AFFID }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          ALERT_IMAP_USER: ${{ secrets.ALERT_IMAP_USER }}
          ALERT_IMAP_PASSWORD: ${{ secrets.ALERT_IMAP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
      - name: Save database
        run: |
          d=$(mktemp -d) && cp data/jobs.sqlite "$d/" && cd "$d"
          git init -q -b data && git add jobs.sqlite
          git -c user.name=job-radar-bot -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "database $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:data
      - name: Commit page and inbox
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs inbox data/pasted.jsonl
          git diff --cached --quiet || git commit -m "daily run $(date -u +%F)"
          git pull -q --rebase -X theirs origin main   # two back-to-back runs: the newer page wins
          git push
