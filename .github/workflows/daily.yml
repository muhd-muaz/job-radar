name: daily-run

on:
  schedule:
    - cron: "30 0 * * *"   # 08:30 Malaysia time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["inbox/**", "config/**", "jobradar/**"]

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: pip install -q pytest && python -m pytest -q tests
      - name: Collect, score and build the shortlist
        run: python -m jobradar
      - name: Commit results
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "daily run $(date -u +%F)"
          git push
